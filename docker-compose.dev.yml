services:
  postgres-kanlist:
    image: postgres:17-alpine
    container_name: postgres-kanlist
    restart: always
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_kanlist_data:/var/lib/postgresql/data
      - ./kanlist/create-table.sql:/docker-entrypoint-initdb.d/1-create-table.sql
      - ./kanlist/copy-table.sql:/docker-entrypoint-initdb.d/2-copy-table.sql
      - ./kanlist-campanha/csv:/csv
    networks:
      - kanlist-network

  server.app:
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: server.app
    restart: always
    networks:
      - kanlist-network
    depends_on:
      - postgres-kanlist
    env_file:
      - ./.env
    environment:
      - DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres-kanlist:5432/${DATABASE_NAME}
    volumes:
      - ./src:/usr/src/app
      - /usr/src/app/node_modules
      - ./logs:/usr/src/app/logs
    command: sh -c "npx prisma generate && npm run dev"
    ports: 
      - "3001:3000"

    frontend-app:
      build:
        context: ./frontend
        dockerfile: Dockerfile
      container_name: frontend-app
      restart: always
      networks:
        - kanlist-network
      env_file: ./.env
      depends_on: server.app
      environment:
        CHOKIDAR_USEPOLLING: "true" # Garante Hot-Reload no container
      volumes:
        - ./frontend:/usr/scr/app
        - ./usr/src/app/node_modules
      command: npm run dev -- --host
      ports:
        "3002:5173"

    pgadmin:
      image: dpage/pgadmin4:latest
      container_name: pgadmin
      restart: always
      environment:
        PGADMIN_DEFAULT_EMAIL: admin@example.com
        PGADMIN_DEFAULT_PASSWORD: admin
      ports:  "5050:80"
      volumes:
        - pgadmin_data:/var/lib/pgadmin
      networks:
        - kanlist-network
      depends_on: 
        - postgres-kanlist
    
  volumes:
    postgres_kanlist_data:
    pgadmin_data:

  networks:
    kanlist-network:
      driver: bridge